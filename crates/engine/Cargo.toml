[package]
name = "spool-engine"
description = "Sans-IO NNTP-over-TLS engine for Spool: TLS, NNTP, yEnc, NZB and PAR2."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Adds an API to trust an extra root CA, used only by the mock-nntp test
# harness. Never enabled in release builds; CI checks the shipped WASM.
test-ca = []
# yEnc hot loop with wasm32 simd128 (build with -C target-feature=+simd128).
simd = []

[dependencies]
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
webpki-roots = { workspace = true }
quick-xml = { workspace = true }
md-5 = { workspace = true }
crc32fast = { workspace = true }
memchr = { version = "2", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
# rustls' std build needs UnixTime::now(); "web" provides it via Date.now().
rustls-pki-types = { version = "1", features = ["web"] }

[dev-dependencies]
rand = { version = "0.9", default-features = false, features = ["small_rng", "std"] }
