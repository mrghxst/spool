[workspace]
resolver = "2"
members = ["crates/engine", "crates/relay", "tools/mock-nntp"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mrghxst/spool"
rust-version = "1.85"

[workspace.dependencies]
spool-engine = { path = "crates/engine" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rustls-pki-types = "1"
quick-xml = "0.42"
md-5 = "0.11"
crc32fast = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The engine is size-sensitive in the browser; wasm-opt runs afterwards.
[profile.release.package.spool-engine]
opt-level = 3
