name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build static binary
        env:
          RUSTFLAGS: -C linker=rust-lld -C target-feature=+crt-static
        run: |
          cargo build --release --locked -p spool-relay --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/spool-relay dist/spool-relay-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: spool-relay-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum spool-relay-* > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
