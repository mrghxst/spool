name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            file: spool-relay-linux-amd64
            rustflags: -C linker=rust-lld -C target-feature=+crt-static
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            file: spool-relay-linux-arm64
            rustflags: -C linker=rust-lld -C target-feature=+crt-static
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            file: spool-relay-windows-amd64.exe
            rustflags: -C target-feature=+crt-static
          - os: macos-15
            target: aarch64-apple-darwin
            file: spool-relay-macos-arm64
          - os: macos-15
            target: x86_64-apple-darwin
            file: spool-relay-macos-amd64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cargo build --release --locked -p spool-relay --target ${{ matrix.target }}
          mkdir -p dist
          bin=target/${{ matrix.target }}/release/spool-relay
          [[ -f "$bin.exe" ]] && bin="$bin.exe"
          cp "$bin" "dist/${{ matrix.file }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.file }}
          path: dist/*

  publish:
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum spool-relay-* > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
