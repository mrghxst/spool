name: relay

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/spool-relay
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=spool-relay
            org.opencontainers.image.description=A tiny WebSocket to TCP relay that only forwards TLS.
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check image size (< 5 MB)
        run: |
          tag="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker pull --platform linux/amd64 "$tag"
          size=$(docker image inspect "$tag" --format '{{.Size}}')
          echo "Image size: $size bytes"
          test "$size" -lt 5000000
      - name: Smoke test
        run: |
          tag="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run -d --name relay -p 8080:8080 "$tag"
          sleep 2
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q '"protocol":1'
          docker exec relay /spool-relay healthcheck
          test "$(docker logs relay 2>&1 | wc -l)" -eq 1
