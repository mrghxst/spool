[package]
name = "mock-nntp"
description = "TLS NNTP test server and NZB generator for Spool's tests."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "mock-nntp"
path = "src/main.rs"

[dependencies]
spool-engine = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { workspace = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = { workspace = true }

[dev-dependencies]
spool-engine = { workspace = true, features = ["test-ca"] }
spool-relay = { path = "../../crates/relay" }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
